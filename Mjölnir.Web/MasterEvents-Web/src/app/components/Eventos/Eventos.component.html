 <app-Titulo [titulo]="'Events'"></app-Titulo> <!--Events está em aspas simples pois ele é o valor da string -->
<div class="form-inline">
    <div class="form-group mb-2">
        <label class="mr-2">Filter:</label>
        <input type="text" class="form-control mr-2" placeholder="Search" [(ngModel)]="filtroLista">
    </div>
</div>
<!-- <h3>Filter: {{filtroLista}} </h3> -->
<table class="table table-striped">
    <thead class="thead-dark">
        <tr>
            <th>
                <button type="button" class="btn btn-outline-light btn-sm" (click)="alterarEstadoImagem()">
                    <i class="{{!showImage ? 'fa fa-eye' : 'fa fa-eye-slash'}}  "></i>
                    {{!showImage ? 'Show' : 'Hide'}}
                </button>
            </th>
            <th>#</th>
            <th>Theme</th>
            <th>Place</th>
            <th>Date</th>
            <th>Number of Persons</th>
            <th>Batch</th>
            <th>Options</th>
        </tr>
    </thead>
    <tbody *ngIf="eventos && eventos.length">
        <tr *ngFor="let evento of eventosFiltrados">
            <td>
                <img [collapse]="!showImage" [isAnimated]="true" src="/assets/{{evento.imageUrl}}"
                    [style.width.px]="widthImg" [style.margin.px]="marginImg">
            </td>
            <td>{{evento.id}}</td>
            <td>{{evento.tema}}</td>
            <td>{{evento.local}}</td>
            <td>{{evento.dataEvento | DateFormatPipe}}</td>
            <td>{{evento.qtdPessoas}}</td>
            <td>{{evento.lotes[0].nome}}</td>
            <td>
                <button type="button" class="btn btn-primary btn-sm mr-2" tooltip="Edit">
                    <i class="fa fa-edit "></i>
                </button>

                <button type="button" class="btn btn-danger btn-sm" tooltip="Delete" (click)="openModal(template)">
                    <i class="fa fa-trash "></i>
                </button>
            </td>
        </tr>
    </tbody>
    <tfoot *ngIf="!eventos.length">
        <tr>
            <td colspan="8" class="text-center">
                <h4>No event found</h4>
            </td>
        </tr>
    </tfoot>
</table>

<!-- {{eventos | json}} -->

<ng-template #template>
    <div class="modal-body text-center">
      <p>Do you want to delete?</p>
      <button type="button" class="btn btn-default" (click)="confirm()" >Yes</button>
      <button type="button" class="btn btn-primary" (click)="decline()" >No</button>
    </div>
  </ng-template>
